<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CronPulse — Sign In</title>
  <!-- Changed: Geist + JetBrains Mono — premium dark SaaS aesthetic (was Sora/JetBrains) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#060709" />
  <style>html{background:#060709;color:#e8edf5}</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',s1:'var(--surface)',b1:'var(--border)',b2:'var(--border2)',ac:'var(--accent)',rd:'var(--red)',t1:'var(--text)',t2:'var(--text2)',t3:'var(--text3)'},fontFamily:{sans:['Geist','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  <style type="text/tailwindcss">
    :root{--bg:#060709;--surface:#0f1117;--border:#1c2133;--border2:#232a3d;--accent:#4f8ef7;--accent2:#7c6df0;--red:#f04545;--text:#e8edf5;--text2:#7e8da8;--text3:#3d4a63}
    @layer base{
      html{@apply text-[14px]}
      body{@apply font-sans bg-bg text-t1 min-h-screen flex flex-col items-center justify-center p-5;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.022) 1px,transparent 0);background-size:32px 32px;padding-bottom:max(1.25rem,env(safe-area-inset-bottom))}
      label{@apply block text-[.7rem] font-semibold text-t2 mb-1.5}
      input[type=password]{@apply w-full bg-bg border border-b2 rounded-[9px] text-t1 px-3.5 py-3 outline-none font-mono text-base transition focus:border-ac focus:ring-[3px] focus:ring-[rgba(79,142,247,.15)] placeholder:text-t3}
    }
    @layer components{
      .login-card{@apply relative z-[1] bg-s1 border border-b2 rounded-[14px] sm:rounded-[18px] py-7 px-[22px] sm:py-10 sm:px-9 w-full max-w-[400px] shadow-[0_24px_80px_rgba(0,0,0,.6)]}
      .logo-wrap{@apply flex flex-col items-center gap-3.5 mb-8}
      .logo-icon{@apply w-[42px] h-[42px] sm:w-12 sm:h-12 rounded-[13px] flex items-center justify-center text-[1.2rem] sm:text-[1.4rem];background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 24px rgba(79,142,247,.3)}
      .logo-name{@apply text-[1.3rem] font-extrabold tracking-tight text-t1} .logo-name span{@apply text-ac}
      .logo-tagline{@apply text-[.74rem] text-t3 text-center leading-normal -mt-1.5}
      .divider{@apply flex items-center gap-3 mb-6} .divider-line{@apply flex-1 h-px bg-b1}
      .divider-label{@apply text-[.68rem] text-t3 font-semibold uppercase tracking-wider whitespace-nowrap}
      .form-field{@apply mb-4}
      .btn-login{@apply w-full mt-1.5 py-3 rounded-[9px] font-bold text-[.9rem] text-white flex items-center justify-center gap-2 transition active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed hover:brightness-110;background:linear-gradient(135deg,var(--accent),#3a7bd5);box-shadow:0 1px 3px rgba(79,142,247,.35)}
      .spinner{@apply hidden w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin}
      .err-box{@apply hidden mt-3 px-3.5 py-2.5 rounded-[9px] bg-[rgba(240,69,69,.08)] border border-[rgba(240,69,69,.2)] text-rd text-[.8rem] items-center gap-2} .err-box.show{@apply flex}
      .err-icon{@apply text-xs shrink-0}
      .hint{@apply mt-[18px] text-center text-[.7rem] text-t3 leading-relaxed}
      .feature-badges{@apply flex gap-2 justify-center mt-6 flex-wrap}
      .feature-badge{@apply flex items-center gap-1 text-[.65rem] text-t3 bg-s1 border border-b1 px-2.5 py-1 rounded-full}
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">⚡</div>
      <div class="logo-name">Cron<span>Pulse</span></div>
      <div class="logo-tagline">Cron job scheduler & uptime monitor</div>
    </div>

    <!-- Changed: Divider label instead of bare h2 -->
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-label">Sign in to continue</div>
      <div class="divider-line"></div>
    </div>

    <!-- Form — logic preserved exactly -->
    <div class="form-field">
      <label>User ID</label>
      <!-- Changed: autocomplete and placeholder preserved; input styled differently -->
      <input type="password" id="userId" placeholder="Enter your user ID" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <span class="spinner" id="spinner"></span>
      <span id="loginBtnText">Sign In →</span>
    </button>

    <!-- Changed: Error box uses flex layout with icon -->
    <div class="err-box" id="errMsg">
      <span class="err-icon">⚠</span>
      <span id="errText"></span>
    </div>

    <p class="hint">Access is restricted to authorized users only.</p>
  </div>

  <!-- Changed: Trust badges below card — visual polish -->
  <div class="feature-badges">
    <div class="feature-badge">🔒 Secure</div>
    <div class="feature-badge">⚡ Fast</div>
    <div class="feature-badge">📡 Real-time</div>
  </div>

  <script>
    // Changed: Enter key handler preserved exactly
    document.getElementById('userId').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() { // Changed: logic preserved exactly; spinner + new error UI added
      const uid  = document.getElementById('userId').value.trim();
      const btn  = document.getElementById('loginBtn');
      const err  = document.getElementById('errMsg');
      const errT = document.getElementById('errText');
      const spin = document.getElementById('spinner');
      const txt  = document.getElementById('loginBtnText');

      err.classList.remove('show'); // Changed: uses class toggle instead of style.display
      if (!uid) {
        errT.textContent = 'Please enter your User ID.'; // preserved logic
        err.classList.add('show');
        return;
      }

      btn.disabled = true; // preserved exactly
      spin.style.display = 'block'; // Changed: show spinner
      txt.textContent = 'Signing in…'; // Changed: ellipsis style matches brand

      try {
        const r = await fetch('/api/auth/login', { // preserved exactly
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: uid })
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.detail || 'Invalid User ID'); } // preserved exactly
        window.location.href = '/'; // preserved exactly
      } catch (e) {
        errT.textContent = e.message; // preserved logic
        err.classList.add('show'); // Changed: class instead of display
        btn.disabled = false; // preserved exactly
        spin.style.display = 'none'; // Changed: hide spinner on error
        txt.textContent = 'Sign In →'; // Changed: restore button text
      }
    }
  </script>
</body>
</html>
